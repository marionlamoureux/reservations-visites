<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Demande de visite{% endblock %}</title>
  <style>
    :root { --green: #2e7d32; --bg: #f5f6f4; --border: #d5d9d2; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background: var(--bg); color: #1b1b1b; margin: 0; padding: 1.5rem; }
    .card { max-width: 640px; margin: 1.5rem auto; background: #fff; border-radius: 12px;
            padding: 2rem; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
    h1 { margin-top: 0; color: var(--green); font-size: 1.5rem; }
    label { display: block; font-weight: 600; margin: 1.1rem 0 .35rem; }
    input[type=text], input[type=date], input[type=time], input[type=number], input[type=password] {
      width: 100%; padding: .6rem .7rem; border: 1px solid var(--border);
      border-radius: 8px; font-size: 1rem; }
    .radio-group label { display: inline-flex; align-items: center; gap: .35rem;
      font-weight: 400; margin-right: 1.2rem; }
    button { margin-top: 1.5rem; background: var(--green); color: #fff; border: 0;
      padding: .75rem 1.4rem; border-radius: 8px; font-size: 1rem; cursor: pointer; }
    button:hover { opacity: .92; }
    .error { background: #fdecea; color: #b71c1c; padding: .75rem 1rem;
      border-radius: 8px; margin-bottom: 1rem; }
    table { border-collapse: collapse; width: 100%; font-size: .85rem; }
    th, td { border: 1px solid var(--border); padding: .45rem .6rem; text-align: left; }
    th { background: #eef1ec; }
    .topbar { display: flex; justify-content: space-between; align-items: center; }
    a { color: var(--green); }
  </style>
</head>
<body>
  <div class="card">
    {% block body %}{% endblock %}
  </div>
</body>
</html>
